<template name="UserControlPanel">
  <div class="col-xs-12">
    <h3 class="text-center">Halaman Ganti Password</h3>
    <div class="">
    <form class="form-horizontal" id="changePassword">
      <div class="form-group">
        <input type="password" name="oldPwField" id="oldPwField" class="form-control" placeholder="Password Lama">
      </div>

      <div class="form-group">
        <input type="password" name="newPwField" id="newPwField" class="form-control" placeholder="Password Baru">
      </div>
      <div class="form-group">
        <button type="submit" class="form-control btn btn-warning">Ganti</button>
      </div>
    </form>
    </div>
  </div>
</template>

<template name="AddPost">
  <h1 class="text-center" style="font-family: 'Quicksand', sans-serif;">Buat Post Baru</h1>
  <div class="col-xs-12">
    <form role="form" id="addPost">

      <div class="form-group">
        <label for="postTitle" style="font-family: 'Quicksand', sans-serif;">Post Title:</label>
        <input type="text" name="postTitle" id="postTitle" class="form-control" placeholder="Masukan judul">
      </div>

      <div class="form-group">
        <select class="form-control" id="postKategori">
          {{#each kategori}}
          <option class="form-control" style="font-family: 'Quicksand', sans-serif;">{{Kategori}}</option>
          {{/each}}
        </select>
      </div>

<div class="form-group">
  <label for="postMessage" style="font-family: 'Quicksand', sans-serif;"> Post Message</label>
  <textarea class="form-control" id="summernote" rows="4"></textarea>
</div>

<div class="form-group">
  <div class="row">
  <div class="col-md-4"></div>
  <div class="col-md-4"><button type="submit" class="w3-btn w3-white w3-border w3-border-green w3-round-xlarge w3-text-green">submit post</button></div>
  <div class="col-md-4"></div>
</div>


</div>
    </form>

  </div>


</template>

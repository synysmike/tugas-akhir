<template name="ImageSlider">

  <div id="carousel-example-generic" class="carousel slide" data-ride="carousel">
    <!-- Indicators -->
    <ol class="carousel-indicators">
      <li data-target="#carousel-example-generic" data-slide-to="0" class="active"></li>
      <li data-target="#carousel-example-generic" data-slide-to="1"></li>
      <li data-target="#carousel-example-generic" data-slide-to="2"></li>
    </ol>

    <!-- Wrapper for slides -->
    <div class="carousel-inner" role="listbox">
      <div class="item active">
        <img src="http://lorempixel.com/output/sports-q-c-640-480-7.jpg" width="100%" alt="...">
        <div class="carousel-caption">
          <h3>Forum-Foruman</h3>
        </div>
      </div>
      <div class="item">
        <img src="http://lorempixel.com/output/sports-q-c-640-480-5.jpg" width="100%" alt="...">
        <div class="carousel-caption">
          <h3>Jangan Daftar</h3>
        </div>
      </div>

      <div class="item">
        <img src="http://lorempixel.com/output/nightlife-q-c-640-480-2.jpg" width="100%" alt="...">
        <div class="carousel-caption">
          <h3>Percuma Sogeh Lek Gak Bahagia!!</h3>
        </div>
      </div>

    </div>

    <!-- Controls -->
    <a class="left carousel-control" href="#carousel-example-generic" role="button" data-slide="prev">
      <span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span>
      <span class="sr-only">Previous</span>
    </a>
    <a class="right carousel-control" href="#carousel-example-generic" role="button" data-slide="next">
      <span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span>
      <span class="sr-only">Next</span>
    </a>
  </div>

</template>
